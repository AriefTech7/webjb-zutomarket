; PHP-FPM/CGI upload limits. Restart/reload PHP or allow user_ini.cache_ttl to expire.
upload_max_filesize = 4M
post_max_size = 32M
max_file_uploads = 20

; Temporary mitigations for CVE-2026-109618 and CVE-2026-109619.
; Upgrade the PHP runtime to a fixed version; these settings are not a complete fix.
memory_limit = -1
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
