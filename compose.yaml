services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-33067}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-game_market}
      MYSQL_USER: ${DB_USERNAME:-game_market}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
