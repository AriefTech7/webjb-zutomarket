name: game-market-production

x-app: &app
  image: game-market-app:production
  build:
    context: .
    target: app
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:?Set APP_URL in .env.production}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_URL: ""
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - frontend
    - backend
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_resource(@fsockopen('127.0.0.1', 9000)) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g

  web:
    image: game-market-web:production
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - app_storage:/var/www/html/storage:ro
    networks:
      - frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-game_market}
      MYSQL_USER: ${DB_USERNAME:-game_market}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_storage:
  mysql_data:

networks:
  frontend:
  backend:
    internal: true
